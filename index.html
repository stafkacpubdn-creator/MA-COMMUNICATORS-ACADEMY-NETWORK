    <meta charset="UTF-8" />

  </head>
  <body class="bg-slate-100 dark:bg-[#0e1b2e] text-slate-900 dark:text-slate-100 antialiased font-sans transition-colors duration-200">
    <script>
      (function() {
        try {
          var palette = localStorage.getItem('kac_theme_palette') || 'navy';
          document.documentElement.setAttribute('data-theme', palette);
          var isDark = palette !== 'light' && palette !== 'sepia';
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
